name: Run job-apply agent

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Job posting URL to open"
        required: true
        type: string
      max_steps:
        description: "Max agent steps"
        required: false
        default: "25"
        type: string

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies and Chromium
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Run agent (headless, stops before submit)
        run: python run.py --url "${{ inputs.url }}" --max-steps "${{ inputs.max_steps }}"
      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-run
          path: |
            runs/
            shots/
